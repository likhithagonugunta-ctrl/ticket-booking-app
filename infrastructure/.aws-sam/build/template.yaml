AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Ticket Booking Application Services: S3 (frontend hosting), API Gateway,
  Lambda, DynamoDB, CodePipeline/CodeBuild (CI/CD)

  '
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE:
          Ref: EventsTable
        BOOKINGS_TABLE:
          Ref: BookingsTable
Parameters:
  ProjectName:
    Type: String
    Default: ticket-booking-app
  Stage:
    Type: String
    Default: prod
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${ProjectName}-frontend-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          AllowedOrigins:
          - '*'
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Statement:
        - Sid: PublicReadGetObject
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${FrontendBucket}/*
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${ProjectName}-Events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: eventId
        AttributeType: S
      KeySchema:
      - AttributeName: eventId
        KeyType: HASH
  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${ProjectName}-Bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: bookingId
        AttributeType: S
      - AttributeName: eventId
        AttributeType: S
      KeySchema:
      - AttributeName: bookingId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: EventIdIndex
        KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  TicketApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${ProjectName}-api
      StageName:
        Ref: Stage
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-listEvents
      CodeUri: ListEventsFunction
      Handler: listEvents.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events
            Method: GET
    Metadata:
      SamResourceId: ListEventsFunction
  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-getEvent
      CodeUri: GetEventFunction
      Handler: getEvent.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /events/{eventId}
            Method: GET
    Metadata:
      SamResourceId: GetEventFunction
  CreateBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-createBooking
      CodeUri: CreateBookingFunction
      Handler: createBooking.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BookingsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /bookings
            Method: POST
    Metadata:
      SamResourceId: CreateBookingFunction
  ListBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-listBookings
      CodeUri: ListBookingsFunction
      Handler: listBookings.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BookingsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId:
              Ref: TicketApi
            Path: /bookings
            Method: GET
    Metadata:
      SamResourceId: ListBookingsFunction
Outputs:
  ApiEndpoint:
    Description: API Gateway base URL
    Value:
      Fn::Sub: https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Description: S3 static website URL
    Value:
      Fn::GetAtt:
      - FrontendBucket
      - WebsiteURL
  FrontendBucketName:
    Description: S3 bucket name for frontend deployment
    Value:
      Ref: FrontendBucket
  EventsTableName:
    Value:
      Ref: EventsTable
  BookingsTableName:
    Value:
      Ref: BookingsTable
