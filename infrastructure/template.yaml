AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Ticket Booking Application
  Services: S3 (frontend hosting), API Gateway, Lambda, DynamoDB, CodePipeline/CodeBuild (CI/CD)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        BOOKINGS_TABLE: !Ref BookingsTable

Parameters:
  ProjectName:
    Type: String
    Default: ticket-booking-app
  Stage:
    Type: String
    Default: prod
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key (sk_live_... or sk_test_...)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret (whsec_...)
  FrontendUrlParam:
    Type: String
    Default: ""
    Description: >
      Public frontend URL, used for Stripe redirect after checkout.
      Leave blank on first deploy; set it after the FrontendUrl output
      is known, then redeploy once.

Resources:

  ############################################
  # S3 - Frontend static website hosting
  ############################################
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET]
            AllowedOrigins: ["*"]

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

  ############################################
  # DynamoDB Tables
  ############################################
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-Events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-Bookings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventIdIndex
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ############################################
  # API Gateway
  ############################################
  TicketApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  ############################################
  # Lambda Functions
  ############################################
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-listEvents"
      CodeUri: ../backend/src/
      Handler: listEvents.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events
            Method: GET

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getEvent"
      CodeUri: ../backend/src/
      Handler: getEvent.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /events/{eventId}
            Method: GET

  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-createCheckoutSession"
      CodeUri: ../backend/src/
      Handler: createCheckoutSession.handler
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL: !Ref FrontendUrlParam
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /checkout
            Method: POST

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-stripeWebhook"
      CodeUri: ../backend/src/
      Handler: stripeWebhook.handler
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /webhook
            Method: POST

  GetBookingBySessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-getBookingBySession"
      CodeUri: ../backend/src/
      Handler: getBookingBySession.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /bookings/lookup
            Method: GET

  ListBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-listBookings"
      CodeUri: ../backend/src/
      Handler: listBookings.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TicketApi
            Path: /bookings
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub "https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  WebhookUrl:
    Description: Register this URL as a Stripe webhook endpoint (checkout.session.completed)
    Value: !Sub "https://${TicketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhook"

  FrontendUrl:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL

  FrontendBucketName:
    Description: S3 bucket name for frontend deployment
    Value: !Ref FrontendBucket

  EventsTableName:
    Value: !Ref EventsTable

  BookingsTableName:
    Value: !Ref BookingsTable
